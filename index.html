<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive layout -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>PHILEdev | Web Development & Digital Solutions</title>

    <meta
      name="description"
      content="PHILEdev builds websites, digital products, intelligent systems and technology solutions for businesses, creators and organizations."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="author" content="PHILEdev" />

    <meta
      name="keywords"
      content="PHILEdev, web development, website design, software development, digital solutions, UI UX design, web applications, technology company, Nigeria"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://philedev.name.ng/"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0E2F93" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/philedev-logo.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="PHILEdev"
    />

    <meta
      property="og:title"
      content="PHILEdev | Web Development & Digital Solutions"
    />

    <meta
      property="og:description"
      content="PHILEdev builds websites, digital products, intelligent systems and technology solutions for businesses, creators and organizations."
    />

    <meta
      property="og:url"
      content="https://philedev.name.ng/"
    />

    <meta
      property="og:image"
      content="https://philedev.name.ng/philedev-logo.png"
    />

    <meta
      property="og:image:alt"
      content="PHILEdev — The Love of Development"
    />

    <!-- X / Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="PHILEdev | Web Development & Digital Solutions"
    />

    <meta
      name="twitter:description"
      content="PHILEdev builds websites, digital products, intelligent systems and technology solutions for businesses, creators and organizations."
    />

    <meta
      name="twitter:image"
      content="https://philedev.name.ng/philedev-logo.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PHILEdev",
        "url": "https://philedev.name.ng/",
        "logo": "https://philedev.name.ng/philedev-logo.png",
        "description": "PHILEdev builds websites, digital products, intelligent systems and technology solutions for businesses, creators and organizations.",
        "telephone": "+2349120770311",
        "founder": {
          "@type": "Person",
          "name": "Ugoji Michael Chidera"
        }
      }

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
